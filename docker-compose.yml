services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tierforge
      POSTGRES_PASSWORD: tierforge
      POSTGRES_DB: tierforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tierforge"]
      interval: 2s
      retries: 15
volumes:
  pgdata:
